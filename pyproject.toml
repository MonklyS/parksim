[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "parksim"
version = "0.1.0"
description = "Discrete-event theme park simulation engine: guests, queues, weather, breakdowns and incidents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
dev = ["parksim[server]", "pytest>=8", "pytest-cov>=5", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
parksim = "parksim.cli:main"
parksim-server = "parksim_server.__main__:main"

[tool.setuptools.packages.find]
include = ["parksim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["parksim", "parksim_server"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
